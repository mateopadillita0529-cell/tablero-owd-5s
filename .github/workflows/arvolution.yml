name: Actualizar datos desde Arvolution

on:
  schedule:
    - cron: "*/15 * * * *"      # cada 15 min (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:             # botón "Run workflow" para correrlo a mano
    inputs:
      solo:
        description: "Fuentes (vacío = OWD y 5S, acciones cada hora). Ej.: owd 5s acciones"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: arvolution-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: pip install --quiet requests openpyxl pandas

      - name: Descargar y procesar reportes
        env:
          ARVOLUTION_EMAIL: ${{ secrets.ARVOLUTION_EMAIL }}
          ARVOLUTION_PASSWORD: ${{ secrets.ARVOLUTION_PASSWORD }}
        run: |
          if [ -n "${{ github.event.inputs.solo }}" ]; then
            python sync/arvolution_sync.py --solo ${{ github.event.inputs.solo }}
          else
            python sync/arvolution_sync.py
          fi

      - name: Publicar datos
        if: always()
        run: |
          git config user.name "tablero-bot"
          git config user.email "tablero-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
          else
            git commit -m "Datos Arvolution $(TZ=America/Bogota date '+%Y-%m-%d %H:%M')"
            git pull --rebase --quiet || true
            git push
          fi
